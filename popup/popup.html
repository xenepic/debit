<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>イオンデビット明細CSV</h1>
    <p id="hint" class="hint">
      ご利用明細ページで月のタブやプルダウンを切り替えると、その月の明細が取得されます。
    </p>
    <table id="months" hidden>
      <thead>
        <tr><th>ご利用分</th><th>件数</th><th>合計</th><th>未確定</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="actions">
      <button id="download" type="button" disabled>CSVをダウンロード</button>
      <button id="clear" type="button" class="secondary" disabled>クリア</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
